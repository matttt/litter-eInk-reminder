[platformio]
default_envs = t5-epaper-s3
boards_dir = boards

[env:t5-epaper-s3]
platform = espressif32@6.12.0
board = T5-ePaper-S3
framework = arduino
board_build.filesystem = littlefs

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
    -DLILYGO_T5_EPD47_S3

lib_deps =
    WiFi
    Wire
    ; Pin the exact LilyGo driver revision used for this port. Its manifest
    ; pulls in SensorLib, which provides SensorPCF8563.hpp.
    https://github.com/Xinyuan-LilyGO/LilyGo-EPD47.git#391b0e25d7a39897e3a00af34053250df031d699

upload_protocol = esptool
upload_speed = 921600
monitor_speed = 115200
monitor_filters =
    default
    esp32_exception_decoder
